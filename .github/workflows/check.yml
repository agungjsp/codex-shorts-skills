name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python syntax
        run: python -m py_compile $(git ls-files '*.py')
      - name: JavaScript syntax
        run: |
          for f in $(git ls-files '*.mjs' '*.js'); do
            node --check "$f"
          done
      - name: No personal drive paths in scripts
        run: |
          if git grep -nE '^[^#/]*["'"'"'][A-Z]:[/\\](Users|animated-shorts|assets-library)' -- '*.py' '*.mjs' '*.js'; then
            echo "Found a hardcoded personal path"; exit 1
          fi
